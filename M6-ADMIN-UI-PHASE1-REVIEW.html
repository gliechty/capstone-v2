<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOSAIC Phase 1 — Admin Center Review</title>
<style>
html { color-scheme: light dark; }
body { margin: 0; padding: 24px; background: light-dark(#f8faf8, #101b15); }
main#review-shell { max-width: 1100px; margin: auto; }
@media (max-width: 650px) { body { padding: 10px; } }
</style>
</head>
<body><style>
#m6-three{--paper:light-dark(#fff,#192722);--ink:light-dark(#213c31,#e4eee8);--muted:light-dark(#52665c,#b1c5ba);--soft:light-dark(#eff4ef,#25392f);--line:light-dark(#d4dfd5,#496052);--green:light-dark(#285c40,#b5dbb5);--on:light-dark(#fff,#183321);--warn:light-dark(#855819,#efc780);font:15px/1.5 system-ui,sans-serif;color:var(--ink)}
#m6-three *{box-sizing:border-box}#m6-three .shell{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}#m6-three .preview{font-size:12px;color:var(--muted);margin-bottom:10px}#m6-three header{padding:20px 24px;background:var(--soft);display:flex;gap:24px;align-items:center;flex-wrap:wrap}#m6-three header strong{letter-spacing:3px;font-size:19px}#m6-three main{padding:22px 24px}#m6-three button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:8px 13px;border-radius:6px}#m6-three button.primary{background:var(--green);color:var(--on);border-color:var(--green)}#m6-three button:disabled{opacity:.45;cursor:not-allowed}#m6-three h1{font-size:26px;line-height:1.25;margin:0 0 12px}#m6-three h2{font-size:18px;margin:0 0 10px}#m6-three p{margin:0 0 13px}#m6-three .muted{color:var(--muted)}#m6-three .badge{font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--green);text-transform:uppercase}#m6-three .box{background:var(--soft);border-radius:8px;padding:18px}#m6-three .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#m6-three .between{justify-content:space-between}#m6-three .grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(240px,1fr);gap:22px}#m6-three .space{margin-top:18px}#m6-three .item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#m6-three .item:last-child{border-bottom:0}#m6-three label{display:block;margin:12px 0;font-weight:500}#m6-three input,#m6-three select,#m6-three textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:10px;border-radius:5px;margin-top:5px}#m6-three table{border-collapse:collapse;width:100%;font-size:14px}#m6-three th,#m6-three td{text-align:left;padding:11px 9px;vertical-align:top;border-bottom:1px solid var(--line)}#m6-three .scroll{overflow-x:auto}#m6-three footer{border-top:1px solid var(--line);padding-top:16px;margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#m6-three details{margin:14px 0}#m6-three summary{font-weight:600}#m6-three .error{color:var(--warn)}#m6-three .notice{background:var(--soft);padding:12px 24px}#m6-three .notice:empty{display:none}#m6-three [hidden]{display:none!important}#m6-three .back{margin-bottom:18px}#m6-three code{overflow-wrap:anywhere;font-size:13px}@media(max-width:650px){#m6-three .grid{grid-template-columns:1fr}#m6-three main,#m6-three header{padding:16px}#m6-three h1{font-size:23px}#m6-three input,#m6-three select,#m6-three textarea{font-size:16px}}@media(pointer:coarse){#m6-three button{min-height:44px}}
</style>
<div id="m6-three">
 <p class="preview">M6.0 · Visual review only · Representative records · Saves are simulated; no application data or login changes</p>
 <div class="shell"><header><strong>MOSAIC</strong><span>Admin Center</span><span class="muted">Guy · Editor identity preview</span></header><div id="m6-message" class="notice" role="status" aria-live="polite"></div><main id="m6-body"></main></div>
</div>
<script>
(()=>{
const root=document.getElementById('m6-three'),get=id=>root.querySelector('#'+id),copy=x=>JSON.parse(JSON.stringify(x)),escape=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const questions=[{id:'U-001',text:'Does your company have a written environmental policy that applies to your own operations?',scale:'YN',metric:'',kind:'scale',category:'Governance'},{id:'U-031',text:'What percentage of your waste is diverted from landfill (recycled, reused, composted) by mass? Skip if unsure',scale:'NUMERIC_INPUT',metric:'waste_diverted_percent',kind:'waste',category:'Resources'},{id:'U-018',text:'How many times per year does your company provide health and safety training to employees?',scale:'NUMERIC_INPUT',metric:'safety_training_frequency',kind:'training',category:'People'}];
const scales={YN:[['Yes',100],['No',0]],PARTIAL_3:[['No',0],['Some',50],['Yes',100]],PROGRESS_5:[['None',0],['Planned',25],['Partially implemented',50],['Implemented',75],['Sustained',100]],NUMERIC_INPUT:[]};
const metrics=[{id:'waste_diverted_percent',name:'Percent diverted from landfill',unit:'percent',method:'identity_percent',range:'0–100',direction:'higher_better',scope:'Global · all',notes:'Direct percentage scoring',kind:'waste'},{id:'MET_WASTE_DIV',name:'Waste diversion rate',unit:'%',method:'identity_percent',range:'0–100',direction:'higher_better',scope:'Global · all',notes:'Direct percentage scoring',kind:'waste'},{id:'safety_training_frequency',name:'Safety training frequency',unit:'times per year',method:'linear_cap',range:'Parameter 1: 2',direction:'higher_better',scope:'Global · all',notes:'S = min(x / 2, 1)',kind:'training'},{id:'MET_EN_INT_REV',name:'Energy intensity per revenue',unit:'kWh/USD',method:'inverse_linear_cap',range:'Parameters: 0, 2',direction:'lower_better',scope:'Manufacturing (Industrial / Components)',notes:'0 is best, 2+ is capped at worst',kind:'energy'}];
const initial={schema:8,page:'home',qid:'U-001',query:'',work:null,notes:'',versions:[{n:1,rows:questions,editor:'Unavailable — imported baseline',at:'Unavailable — imported baseline',notes:'',summary:['Imported approved configuration; prior change history unavailable.']}],document:'QuestionBank',docAction:'view',seen:1};
let s=copy(initial),message='';const savedState=window.openai?.widgetState?.privateContent;if(savedState?.schema===8)s=savedState;
const latest=()=>s.versions[s.versions.length-1],rows=()=>s.work||latest().rows;
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{phase:1,model:'universal-kb-config-source',page:s.page,configVersion:latest().n,unsaved:!!s.work},privateContent:s}).catch(()=>{})}
window.addEventListener('openai:set_globals',e=>{const next=e.detail?.globals?.widgetState?.privateContent;if(next?.schema===8){s=next;render()}});
function b(label,action,primary=false,disabled=false){return `<button class="cursor-interaction ${primary?'primary':''}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`}
function go(page){s.page=page;message='';render();persist()}
function diff(){if(!s.work)return [];return s.work.flatMap((q,i)=>['text','scale','metric'].filter(k=>q[k]!==latest().rows[i][k]).map(k=>({id:q.id,field:{text:'Question wording',scale:'AnswerScale',metric:'metric_id'}[k],before:latest().rows[i][k]||'None',after:q[k]||'None'})))}
function problems(){return rows().flatMap(q=>!q.text.trim()?[q.id+': enter question wording.']:q.kind==='scale'&&q.scale==='NUMERIC_INPUT'?[q.id+': a scale-based question needs answer options.']:q.kind!=='scale'&&q.scale!=='NUMERIC_INPUT'?[q.id+': numeric questions need direct numeric input.']:q.kind==='scale'&&q.metric?[q.id+': this scale-based question does not use a metric benchmark.']:q.kind!=='scale'&&!metrics.some(m=>m.id===q.metric&&m.kind===q.kind)?[q.id+': benchmark units or subject do not match this representative question.']:[])}
function detailsScale(id){return id==='NUMERIC_INPUT'?'<p>Direct numeric entry.</p><p class="muted">No option scores. The assigned metric defines scoring. This scoring placeholder is read-only.</p>':'<table><thead><tr><th>Option</th><th>Score / 100</th></tr></thead><tbody>'+scales[id].map(o=>'<tr><td>'+escape(o[0])+'</td><td>'+o[1]+'</td></tr>').join('')+'</tbody></table>'}
function detailsMetric(id){const m=metrics.find(m=>m.id===id);return m?`<h2>${escape(m.name)}</h2><p><b>Units:</b> ${escape(m.unit)}<br><b>Method:</b> ${escape(m.method)}<br><b>Range / parameters:</b> ${escape(m.range)}<br><b>Direction:</b> ${escape(m.direction)}<br><b>Applies to:</b> ${escape(m.scope)}</p><p>${escape(m.notes)}</p>`:'<p>No benchmark assigned. This question is scored using its answer scale.</p>'}
function status(){return `<span class="badge">Configuration set · ${s.work?'Unsaved changes based on v'+latest().n:'Saved v'+latest().n}</span><p class="muted">KB: approved source collection · source membership unchanged</p>`}
function render(){get('m6-message').textContent=message;let h=s.page==='home'?'':`<div class="back">${b('← Admin Center','home')}</div>`;
if(s.page==='home'){h+=`<h1>Admin Center</h1><details open class="box"><summary>Universal Scoring Documents</summary><p class="space">Save and publish affects new assessments across all configuration sets; existing assessments retain their starting versions.</p>${['AnswerScales','MetricBenchmarks'].map(d=>`<div class="item"><b>${d}</b><div class="row">${b('Edit','editdoc-'+d)}${b('Download','download-'+d)}${b('History','dochistory-'+d)}</div></div>`).join('')}</details><details open class="box"><summary>KB / Configuration Set</summary><p class="space"><b>Default KB:</b> approved source collection · 44 documents<br><b>Configuration set:</b> SME sustainability · latest saved v${latest().n}<br>161 QuestionBank records · Created: unavailable</p><p class="muted">A KB is a set of source documents. Its configuration set contains the non-universal assessment configuration.</p><div class="item"><div><b>QuestionBank</b><div class="muted">Wording and answerScale / metric mappings only</div></div>${b(s.work?'Continue editing':'Open QuestionBank','questions',true)}</div><div class="item"><span>Other configuration documents · read-only</span>${b('View / Download','configdocs')}</div><div class="item"><span>Configuration-set versions</span>${b('History','history')}</div>${s.work?'<p class="space">Unsaved question changes retained. '+b('Review changes','review')+'</p>':''}</details><details open class="box"><summary>App-wide Source Records</summary><p class="muted space">These cover the entire app in Phase 1. Read-only.</p>${['DocumentIndex','DocumentChunks'].map(d=>`<div class="item"><b>${d}</b><div class="row">${b('View','viewdoc-'+d)}${b('Download','download-'+d)}</div></div>`).join('')}</details><p class="muted">Preview includes 3 representative questions. Counts above describe the existing baseline.</p>`}
if(s.page==='questions'){h+=status()+`<h1>QuestionBank</h1><label>Find a question<input id="search" value="${escape(s.query)}" placeholder="Search ID or wording: policy, waste, training"></label><div id="list"></div><footer><span>Only question wording and scoring mappings can change.</span>${b('Review changes','review',true,!diff().length)}</footer><p class="muted">${diff().length?'Changes are retained while navigating.':'Make a change to enable review.'}</p>`}
if(s.page==='edit'){const q=rows().find(q=>q.id===s.qid);h+=status()+`<div class="row between"><h1>Edit ${q.id}</h1>${b('Back to QuestionBank','questions')}</div><label>Question wording<textarea id="wording" rows="3">${escape(q.text)}</textarea></label><p class="muted">${q.category} · Question ID, response type, weights and other fields are read-only.</p><div class="grid"><div><label>Assigned AnswerScale<select id="scale">${Object.keys(scales).map(k=>`<option ${q.scale===k?'selected':''}>${k}</option>`).join('')}</select></label></div><aside class="box"><h2>Scale options and scores</h2><div id="scale-details">${detailsScale(q.scale)}</div></aside></div><div class="grid space"><div><label>Assigned metric_id<select id="metric"><option value="">None — scale-based scoring</option>${metrics.map(m=>`<option value="${m.id}" ${q.metric===m.id?'selected':''}>${m.id} · ${escape(m.unit)}</option>`).join('')}</select></label><p class="muted">All representative metrics are visible, including non-percentage units. Inspect compatibility before saving.</p></div><aside class="box" id="metric-details">${detailsMetric(q.metric)}</aside></div><p id="validation" class="error" role="status"></p><footer><div>${b('Discard changes','discard')}</div>${b('Review changes','review',true,!diff().length||!!problems().length)}</footer><p id="reason" class="muted"></p>`}
if(s.page==='review'){const d=diff(),p=problems();h+=status()+`<h1>Review question changes</h1><div class="scroll"><table><thead><tr><th>Question / field</th><th>Before</th><th>After</th></tr></thead><tbody>${d.map(c=>`<tr><td>${c.id}<br>${c.field}</td><td>${escape(c.before)}</td><td>${escape(c.after)}</td></tr>`).join('')}</tbody></table></div><p class="space">${p.length?escape(p.join(' ')):d.length?'Representative checks: wording is present and selected mappings match the sample question types.':'No changes to save.'}</p><p class="muted">These preview checks are not the application’s full validation. Saving creates a configuration-set version, not a new KB or universal scoring document.</p><label>Change notes <span class="muted">(optional)</span><textarea id="notes" rows="3" placeholder="Anything useful for the next reviewer? You can leave this blank.">${escape(s.notes)}</textarea></label><p class="muted">Automatically recorded: editor, save timestamp and the change summary above.</p><footer>${b('Continue editing','questions')}${b('Save changes','save',true,!d.length||!!p.length)}</footer>`}
if(s.page==='done'){h+=`<span class="badge">Simulated save complete</span><h1>Configuration set v${latest().n} saved</h1><p>QuestionBank changes are recorded. The KB's documents and universal scoring documents have not changed.</p><div class="box"><p><b>Editor:</b> ${escape(latest().editor)}<br><b>Saved:</b> ${escape(latest().at)}</p><p><b>Change notes:</b> ${escape(latest().notes||'No notes added')}</p><p><b>Changes:</b> ${latest().changes.map(c=>escape(c.id+' — '+c.field)).join('; ')}</p></div><p class="muted space">Preview only: no configuration was published and no application assessment was changed.</p><footer>${b('Back to Admin Center','home')}${b('View version history','history',true)}</footer>`}
if(s.page==='history'){h+=`<span class="badge">Configuration-set history</span><h1>Versions and changes</h1><p class="muted">The source collection is unchanged. Historical configuration versions remain inspectable.</p>${[...s.versions].reverse().map(v=>`<details open class="box"><summary>Configuration set v${v.n}</summary><p class="space"><b>Editor:</b> ${escape(v.editor)}<br><b>Saved:</b> ${escape(v.at)}<br><b>Change notes:</b> ${escape(v.notes||'No notes added')}</p>${v.changes?'<div class="scroll"><table><thead><tr><th>Field</th><th>Before</th><th>After</th></tr></thead><tbody>'+v.changes.map(c=>`<tr><td>${c.id} · ${c.field}</td><td>${escape(c.before)}</td><td>${escape(c.after)}</td></tr>`).join('')+'</tbody></table></div>':'<p>'+escape(v.summary.join(' '))+'</p>'}${b('Inspect saved questions','inspect-'+v.n)}</details>`).join('')}`}
if(s.page==='inspect'){const v=s.versions.find(v=>v.n===s.seen);h+=`<span class="badge">Read-only · configuration set v${v.n}</span><h1>Saved QuestionBank</h1>${v.rows.map(q=>`<div class="box space"><b>${q.id}</b><p>${escape(q.text)}</p><p class="muted">AnswerScale: ${q.scale} · metric_id: ${q.metric||'None'}</p></div>`).join('')}<footer>${b('Back to history','history')}</footer>`}
if(s.page==='discard'){h+=`<h1>Discard unsaved question changes?</h1><p>Saved configuration versions will remain unchanged. Your unsaved wording, mappings and notes will be cleared.</p><footer>${b('Keep editing','questions')}${b('Discard changes','confirm-discard')}</footer>`}
if(s.page==='configdocs'){h+=`<span class="badge">Configuration set v${latest().n} · read-only documents</span><h1>Other configuration documents</h1>${['MultiplierRules','CategoryWeights'].map(d=>`<div class="item"><b>${d}</b><div class="row">${b('View','viewdoc-'+d)}${b('Download','download-'+d)}</div></div>`).join('')}<p class="muted space">QuestionBank has its own editor. Universal scoring documents and app-wide source records are separate sections in Admin Center.</p>`}
if(s.page==='document'){const universal=['AnswerScales','MetricBenchmarks'].includes(s.document);h+=`<span class="badge">${universal?'Universal scoring document':s.document.startsWith('Document')?'App-wide source record · read-only':'Configuration document · read-only'}</span><h1>${s.document}</h1>${universal?'<p>Save and publish affects new assessments across all configuration sets; existing assessments retain their starting versions.</p>':''}`;if(s.docAction==='history')h+='<div class="box"><h2>Published history</h2><p>Imported baseline · editor and save timestamp unavailable.</p><p class="muted">Future entries show the automatically recorded editor, timestamp, change summary and optional notes. No historical values are invented.</p></div>';else{h+='<p class="muted">Representative existing rows only.</p><div class="scroll">'+docTable(s.document)+'</div>';if(s.docAction==='edit')h+=`<div class="box space"><h2>Edit / Save and publish</h2><p>This screen establishes the intended scope. Universal-document editing and publication are not simulated in this review; the clickable save journey is QuestionBank only.</p>${b('Save and publish','none',true,true)}<p class="muted space">No unsaved universal-document changes.</p></div>`;else h+='<footer>'+b('Download sample CSV','download-'+s.document)+'</footer>'}}
get('m6-body').innerHTML=h;if(s.page==='questions'){get('search').oninput=e=>{s.query=e.target.value;renderList();persist()};renderList()}if(s.page==='edit'){const change=(key,value)=>{if(!s.work)s.work=copy(latest().rows);s.work.find(q=>q.id===s.qid)[key]=value;root.querySelector('.badge').textContent='Configuration set · Unsaved changes based on v'+latest().n;const q=rows().find(q=>q.id===s.qid);get('scale-details').innerHTML=detailsScale(q.scale);get('metric-details').innerHTML=detailsMetric(q.metric);validateEditor();persist()};get('wording').oninput=e=>change('text',e.target.value);get('scale').onchange=e=>change('scale',e.target.value);get('metric').onchange=e=>change('metric',e.target.value);validateEditor()}if(get('notes'))get('notes').oninput=e=>{s.notes=e.target.value;persist()}}
function validateEditor(){const p=problems(),d=diff();get('validation').textContent=p.join(' ');get('reason').textContent=p.length?'Resolve the mapping issue above to review changes.':d.length?'Changes are retained while you navigate.':'Change wording or a mapping to enable review.';root.querySelector('[data-action="review"]').disabled=!d.length||!!p.length}
function renderList(){get('list').innerHTML=rows().filter(q=>(q.id+' '+q.text).toLowerCase().includes(s.query.toLowerCase())).map(q=>`<div class="item"><div style="flex:1;min-width:200px"><span class="badge">${q.id}${diff().some(d=>d.id===q.id)?' · Changed':''}</span><p>${escape(q.text)}</p><span class="muted">${q.scale} · ${q.metric||'No metric'}</span></div>${b('Select '+q.id,'select-'+q.id)}</div>`).join('')||'<p>No matching representative question. Try policy, waste or training.</p>'}
function docRows(doc){return {AnswerScales:Object.entries(scales).flatMap(([id,opts])=>opts.length?opts.map(o=>({answer_scale_id:id,answer_option:o[0],normalized_score:o[1]})):[{answer_scale_id:id,answer_option:'Direct numeric input',normalized_score:'Not an option score'}]),MetricBenchmarks:metrics.map(({kind,...m})=>m),MultiplierRules:[{rule_id:'MR-001',tag:'energy;energy_efficiency;electricity',industry:'Manufacturing (Industrial / Components)',multiplier:1.35}],CategoryWeights:[{industry:'Business / Export Services',people_weight:.2583,governance_weight:.4226,community_weight:.1,resources_weight:.2191}],DocumentIndex:[{doc_id:1,doc_title:'GRI 308: Supplier Environmental Assessment 2016',source:'GRI',status:'To Review'}],DocumentChunks:[{chunk_id:'GRI-308-001',doc_title:'GRI 308: Supplier Environmental Assessment 2016',summary:'Mandatory reporting on the percentage of new suppliers screened using environmental criteria during the selection process.',citation:'GRI 308, Disclosure 308-1'}]}[doc]}
function docTable(doc){const data=docRows(doc),keys=Object.keys(data[0]);return '<table><thead><tr>'+keys.map(k=>'<th>'+escape(k)+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+keys.map(k=>'<td>'+escape(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function download(doc){const data=docRows(doc),keys=Object.keys(data[0]),cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"',csv=[keys,...data.map(r=>keys.map(k=>r[k]))].map(r=>r.map(cell).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='PREVIEW-SAMPLE-'+doc+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message='Downloaded representative sample rows only.';get('m6-message').textContent=message}
root.addEventListener('click',e=>{const a=e.target.closest('button')?.dataset.action;if(!a)return;if(['home','questions','review','history','configdocs','discard'].includes(a)){go(a);return}if(a.startsWith('select-')){s.qid=a.slice(7);go('edit');return}if(a==='save'){if(!diff().length||problems().length)return;s.versions.push({n:latest().n+1,rows:copy(s.work),editor:'Guy — preview identity',at:new Date().toLocaleString('en-GB',{timeZone:'Asia/Bangkok'})+' Bangkok',notes:s.notes.trim(),changes:copy(diff())});s.work=null;s.notes='';go('done');return}if(a==='confirm-discard'){s.work=null;s.notes='';go('questions');return}if(a.startsWith('inspect-')){s.seen=Number(a.slice(8));go('inspect');return}if(a.startsWith('download-')){download(a.slice(9));return}for(const [prefix,action]of [['editdoc-','edit'],['viewdoc-','view'],['dochistory-','history']])if(a.startsWith(prefix)){s.document=a.slice(prefix.length);s.docAction=action;go('document');return}});
render();
})();
</script>
</body></html>
