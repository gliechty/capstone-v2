name: mosaic-app
services:
  app:
    image: ${APP_IMAGE:?Set the verified immutable application image}
    restart: unless-stopped
    init: true # Reap Chromium descendants after bounded PDF jobs.
    env_file:
      - /opt/mosaic-app/credential.env
      - /opt/mosaic-app/operating.env
      - /opt/mosaic-app/admin.env
    environment:
      RECOMMENDATION_PROVIDER: openai
      RECOMMENDATION_MODEL: gpt-5.4-mini
      RECOMMENDATION_REASONING: low
      RECOMMENDATION_TIMEOUT_MS: "30000"
      RECOMMENDATION_MAX_OUTPUT_TOKENS: "4000"
      RECOMMENDATION_PUBLIC_ORIGIN: https://preview.flowagentai.website
      RECOMMENDATION_BUDGET_FILE: /budget/public.json
      RECOMMENDATION_VERIFICATION_FILE: /budget/verification-20261019.json
      NEXT_TELEMETRY_DISABLED: "1"
      MOSAIC_ADMIN_ENABLED: "1"
      MOSAIC_DEV_IDENTITY: "0"
      MOSAIC_ADMIN_DATA_DIR: /admin-data
      MOSAIC_SOURCE_LIBRARY_DIR: /source-library
      BETTER_AUTH_URL: https://preview.flowagentai.website
    volumes:
      - /opt/mosaic-app/budget:/budget
      - /opt/mosaic-app/admin-data:/admin-data
      - /opt/mosaic-app/source-library:/source-library:ro
      - /opt/mosaic-app/archived-atomic-indicators:/BUILD_PACK/04_CONFIG/raw/atomic_indicators:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    networks:
      app_only: {}
      ai_egress:
        gw_priority: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
networks:
  app_only:
    internal: true
  ai_egress:
    external: true
    name: mosaic-ai-egress
