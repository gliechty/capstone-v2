name: capstone-v2-preview
services:
  preview:
    image: ${PREVIEW_IMAGE:?Set an immutable reviewed preview image tag or digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3201:3000"
    environment:
      CAPSTONE_PREVIEW_MODE: synthetic
      RECOMMENDATION_PROVIDER: disabled
      NEXT_TELEMETRY_DISABLED: "1"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    networks: [preview_only]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/preview-health').then(async r=>{const j=await r.json();if(!r.ok||j.mode!=='synthetic'||j.billable!==false||!j.build)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
networks:
  preview_only:
    internal: true
